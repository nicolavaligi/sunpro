name: Verify and publish SunPro
on:
  push:
    branches: [main, codex/sunpro-preselection]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sunpro-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application and browser dependencies
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          python -m pip check
      - name: Python tests including external connectivity
        run: python -m unittest discover -s tests -v
      - name: Interface and report tests
        run: |
          node tests/test_web.cjs
          node tests/test_preselection.cjs
      - name: Browser export verification
        run: python tests/browser_smoke.py
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect Pages mode and request branch build
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            const {data: pages} = await github.rest.repos.getPages(context.repo);
            core.setOutput('type', pages.build_type || 'legacy');
            if (pages.build_type !== 'workflow') await github.rest.repos.requestPagesBuild(context.repo);
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.type == 'workflow'
        with:
          path: web
      - uses: actions/deploy-pages@v4
        if: steps.pages.outputs.type == 'workflow'
        id: deployment
